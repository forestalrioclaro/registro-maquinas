<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro diario de máquinas · Forestal Río Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COLORES (modo claro y oscuro)
   ========================================================= */
:root{
  color-scheme: light;
  --bosque:#1E3B2F;      /* verde pino, color principal */
  --bosque-2:#2D5643;
  --aserrin:#E9DCC4;     /* fondo cálido tipo madera cortada */
  --corteza:#5A4433;
  --papel:#FBF8F2;
  --texto:#1B231F;
  --texto-suave:#5E6862;
  --linea:#D6CBB6;
  --ok:#2E7D4F;
  --alerta:#B5541C;
  --sinprod-bg:#EDE7DC;
  --superficie:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bosque:#9CC9AE; --bosque-2:#7DB394;
    --aserrin:#2A2520; --corteza:#C9B396;
    --papel:#171B19; --texto:#ECE8E1; --texto-suave:#A9B2AC;
    --linea:#3A3F3B; --ok:#7FD0A0; --alerta:#F0A070;
    --sinprod-bg:#24282A; --superficie:#1F2422;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papel); color:var(--texto);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45;
}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bosque-2);outline-offset:2px}

/* ---------- Encabezado ---------- */
header{
  background:var(--bosque); color:#F4EFE6;
  padding:20px 20px 0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) header{background:#13261D} }
.cabecera{max-width:880px;margin:0 auto}
.fila-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;font-size:2rem;line-height:1.05;margin:0;letter-spacing:.01em;
}
.usuario{font-size:.9rem;opacity:.85;display:flex;gap:10px;align-items:center}
.btn-claro{
  background:transparent;border:1px solid rgba(244,239,230,.5);color:#F4EFE6;
  padding:6px 12px;border-radius:6px;cursor:pointer
}
.fecha-bloque{margin:18px 0 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fecha-bloque label{font-weight:500}
.fecha-bloque input{
  background:#F4EFE6;color:#1B231F;border:0;border-radius:6px;
  padding:8px 10px;font-size:1.05rem
}

/* ---------- Pestañas ---------- */
.pestanas{display:flex;gap:4px;margin-top:20px;overflow-x:auto}
.pestanas button{
  background:transparent;border:0;color:#F4EFE6;opacity:.75;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.15rem;
  padding:10px 16px 12px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:8px
}
.pestanas button[aria-selected="true"]{background:var(--papel);color:var(--texto);opacity:1}
.punto{width:9px;height:9px;border-radius:50%;background:#C9A26B;display:inline-block}
.punto.ok{background:#6FCF97}

/* ---------- Contenido ---------- */
main{max-width:880px;margin:0 auto;padding:20px}
.aviso{
  border-left:4px solid var(--alerta);background:var(--superficie);
  padding:12px 14px;margin-bottom:18px;border-radius:0 6px 6px 0;color:var(--texto)
}
.aviso.info{border-left-color:var(--bosque-2)}
.resumen{color:var(--texto-suave);margin:0 0 14px;font-size:.95rem}

.maquinas{list-style:none;margin:0;padding:0;border-top:1px solid var(--linea)}
.maquina{
  display:grid;grid-template-columns:1fr minmax(170px,220px) auto;gap:12px;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--linea)
}
.maquina .nombre{font-weight:600;font-size:1.05rem}
.maquina .nombre small{display:block;font-weight:400;color:var(--texto-suave);font-size:.85rem}
.maquina select{
  width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;
  background:var(--superficie);font-size:1rem
}
.maquina.parada{background:var(--sinprod-bg)}
.maquina.parada select{color:var(--texto-suave)}
.btn-parar{
  border:1px solid var(--linea);background:var(--superficie);border-radius:6px;
  padding:9px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap
}
.maquina.parada .btn-parar{border-color:var(--corteza);color:var(--corteza);font-weight:600}
@media (max-width:560px){
  .maquina{grid-template-columns:1fr auto}
  .maquina select{grid-column:1 / -1;grid-row:2}
}

.acciones{
  position:sticky;bottom:0;background:var(--papel);
  padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--linea);margin-top:8px
}
.btn-guardar{
  background:var(--bosque);color:#F4EFE6;border:0;border-radius:8px;
  padding:13px 26px;font-size:1.05rem;font-weight:600;cursor:pointer
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-guardar{color:#10201A} }
.btn-guardar:disabled{opacity:.5;cursor:wait}
.btn-sec{background:transparent;border:1px solid var(--linea);border-radius:8px;padding:12px 16px;cursor:pointer}
.estado{font-size:.95rem}
.estado.ok{color:var(--ok)} .estado.error{color:var(--alerta)}

.login{
  text-align:center;padding:60px 20px;max-width:440px;margin:0 auto
}
.login p{color:var(--texto-suave)}
.oculto{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="cabecera">
    <div class="fila-top">
      <h1>Registro diario de máquinas</h1>
      
    </div>
    <div class="fecha-bloque" id="bloqueFecha">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="pestanas" role="tablist" id="pestanas"></div>
  </div>
</header>

<main>
  <div id="avisos"></div>

  <section id="pantallaRegistro" class="oculto">
    <p class="resumen" id="resumen"></p>
    <ul class="maquinas" id="listaMaquinas"></ul>
    <div class="acciones">
      <button class="btn-guardar" id="btnGuardar">Guardar registro</button>
      <button class="btn-sec" id="btnTodasParadas">Marcar todas sin producción</button>
      <span class="estado" id="estado" role="status" aria-live="polite"></span>
    </div>
  </section>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN  —  ESTO ES LO ÚNICO QUE DEBES EDITAR
   Pega aquí la "URL de la aplicación web" de Apps Script (termina en /exec).
   Las pestañas, máquinas y largos se editan en Codigo.gs, no aquí.
   ========================================================= */
const URL_API = "https://script.google.com/macros/s/AKfycbwIznCxiVJh47D1WyLlV3PM3oUe0IfwABAqDS6FZjIYtvaLDjoBHMtz9419aYhkNJoO/exec";
/* ========================================================= */

let DATOS = null;     // pestañas, máquinas y largos que entrega la planilla
let SIN = "Sin produccion";
let pestanaActual = 0;
let seleccion = {};   // hoja -> { maquina: valor }
let guardadas = {};   // hoja -> true si la fecha ya está registrada

const $ = id => document.getElementById(id);

/* Conversa con la planilla de Google (Codigo.gs) */
async function api(parametros, cuerpo){
  const opciones = cuerpo
    ? { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) }
    : { method:"GET" };
  const url = cuerpo ? URL_API : URL_API + "?" + new URLSearchParams(parametros);
  let r;
  try{ r = await fetch(url, opciones); }
  catch(e){ throw new Error("Sin conexión con la planilla. Revisa tu internet e inténtalo de nuevo"); }
  let j;
  try{ j = await r.json(); }
  catch(e){ throw new Error("La planilla respondió algo inesperado (revisa que la URL termine en /exec y que el acceso sea «Cualquier usuario»)"); }
  if (!j.ok) throw new Error(j.error || "Error desconocido");
  return j.datos;
}

/* ---------- Utilidades ---------- */
function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fechaLarga(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
}
const mostrarLargo = v => `${String(v).replace(".", ",")} m`;
const normalizar = v => (v === null || v === undefined || v === "") ? "" :
  (String(v).trim().toLowerCase() === SIN.toLowerCase() ? SIN : String(Number(v)));

function aviso(texto, tipo){
  $("avisos").innerHTML = texto ? `<div class="aviso ${tipo||""}">${texto}</div>` : "";
}
function estado(texto, tipo){
  const e = $("estado"); e.textContent = texto || ""; e.className = "estado " + (tipo||"");
}

/* ---------- Pantalla ---------- */
function dibujarPestanas(){
  $("pestanas").innerHTML = DATOS.pestanas.map((p,i) =>
    `<button role="tab" aria-selected="${i===pestanaActual}" data-i="${i}">
       <span class="punto ${guardadas[p.hoja] ? "ok" : ""}" aria-hidden="true"></span>${p.hoja}
     </button>`).join("");
  $("pestanas").querySelectorAll("button").forEach(b =>
    b.onclick = () => { pestanaActual = Number(b.dataset.i); dibujarPestanas(); cargarPestana(); });
}

function dibujarMaquinas(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const opciones = `<option value="">Elegir largo…</option>` +
    DATOS.largos.map(l => `<option value="${String(Number(l))}">${mostrarLargo(l)}</option>`).join("") +
    `<option value="${SIN}">Sin producción</option>`;

  $("listaMaquinas").innerHTML = p.maquinas.map((m, i) => {
    const v = sel[m] || "";
    return `<li class="maquina ${v===SIN ? "parada":""}" data-m="${m}">
      <div class="nombre"><label for="sel${i}">${m}</label></div>
      <select id="sel${i}">${opciones}</select>
      <button class="btn-parar" type="button" aria-pressed="${v===SIN}">No está en uso</button>
    </li>`;
  }).join("");

  $("listaMaquinas").querySelectorAll(".maquina").forEach(li => {
    const m = li.dataset.m, s = li.querySelector("select"), b = li.querySelector(".btn-parar");
    s.value = sel[m] || "";
    s.onchange = () => fijar(m, s.value);
    b.onclick = () => fijar(m, (seleccion[p.hoja][m] === SIN) ? "" : SIN);
  });
  actualizarResumen();
}

function fijar(maquina, valor){
  const hoja = DATOS.pestanas[pestanaActual].hoja;
  seleccion[hoja] = seleccion[hoja] || {};
  seleccion[hoja][maquina] = valor;
  const li = [...$("listaMaquinas").children].find(x => x.dataset.m === maquina);
  if (li){
    li.classList.toggle("parada", valor === SIN);
    li.querySelector("select").value = valor;
    li.querySelector(".btn-parar").setAttribute("aria-pressed", valor === SIN);
  }
  estado("");
  actualizarResumen();
}

function actualizarResumen(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const llenas = p.maquinas.filter(m => sel[m]).length;
  const paradas = p.maquinas.filter(m => sel[m] === SIN).length;
  let t = `${fechaLarga($("fecha").value)}. ${llenas} de ${p.maquinas.length} máquinas con dato`;
  if (paradas) t += `, ${paradas} sin producción`;
  t += guardadas[p.hoja] ? ". Este día ya está registrado; si cambias algo y guardas, se actualiza." : ".";
  $("resumen").textContent = t;
}

async function cargarPestana(){
  const p = DATOS.pestanas[pestanaActual];
  $("listaMaquinas").innerHTML = "";
  $("resumen").textContent = "Cargando máquinas…";
  aviso("");
  try{
    const existentes = await api({ accion:"leer", hoja:p.hoja, fecha:$("fecha").value });
    seleccion[p.hoja] = {};
    p.maquinas.forEach(m => { seleccion[p.hoja][m] = m in existentes ? normalizar(existentes[m]) : ""; });
    guardadas[p.hoja] = Object.keys(existentes).length > 0;
    dibujarPestanas();
    dibujarMaquinas();
  }catch(e){
    $("resumen").textContent = "";
    aviso(`No se pudo leer la hoja <b>${p.hoja}</b>: ${e.message}.`);
  }
}

/* ---------- Guardar ---------- */
async function guardar(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const faltan = p.maquinas.filter(m => !sel[m]);
  if (faltan.length === p.maquinas.length){ estado("Elige un largo o «No está en uso» para al menos una máquina.", "error"); return; }
  if (faltan.length && !confirm(`Faltan ${faltan.length} máquina(s) sin dato:\n${faltan.join(", ")}\n\n¿Guardar igual las demás?`)) return;

  const btn = $("btnGuardar"); btn.disabled = true; estado("Guardando…");
  const registros = {};
  p.maquinas.forEach(m => { if (sel[m]) registros[m] = sel[m]; });

  try{
    const r = await api(null, { accion:"guardar", hoja:p.hoja, fecha:$("fecha").value, registros });
    guardadas[p.hoja] = true;
    dibujarPestanas(); actualizarResumen();
    estado(`Guardado: ${r.agregadas + r.actualizadas} máquina(s) de ${p.hoja}.`, "ok");
  }catch(e){
    estado("No se pudo guardar: " + e.message, "error");
  }finally{
    btn.disabled = false;
  }
}

/* ---------- Arranque ---------- */
async function iniciar(){
  $("fecha").value = hoyISO();
  $("fecha").onchange = () => { guardadas = {}; cargarPestana(); };
  $("btnGuardar").onclick = guardar;
  $("btnTodasParadas").onclick = () => {
    if (confirm("¿Marcar todas las máquinas de esta pestaña como sin producción?"))
      DATOS.pestanas[pestanaActual].maquinas.forEach(m => fijar(m, SIN));
  };

  if (!URL_API){
    aviso("Esta página todavía no está conectada a la planilla de Google. Falta pegar la URL de Apps Script en <code>URL_API</code>.", "info");
    return;
  }
  $("resumen").textContent = "Conectando con la planilla…";
  $("pantallaRegistro").classList.remove("oculto");
  try{
    DATOS = await api({ accion:"config" });
    SIN = DATOS.sinProduccion;
    dibujarPestanas();
    cargarPestana();
  }catch(e){
    $("pantallaRegistro").classList.add("oculto");
    aviso(`No se pudo conectar con la planilla: ${e.message}.`);
  }
}
iniciar();
</script>
</body>
</html>
