<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00B255">
<title>Registro diario de máquinas · Río Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COLORES CORPORATIVOS (Manual de marca Río Claro, 2023)
   ========================================================= */
:root{
  color-scheme: light;
  --verde:#00B255;        /* Pantone 7481 C */
  --gris:#898A8D;         /* Pantone Cool Gray 8 C */
  --negro:#000000;
  --rojo:#bd2c2c;         /* complementario: errores */
  --azul:#2659a5;         /* complementario */
  --texto:#2B2C2E;
  --fondo:#F5F6F6;
  --superficie:#FFFFFF;
  --linea:#DCDDDE;
  --verde-suave:#E6F7EE;
  --gris-suave:#EFEFF0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--fondo); color:var(--texto);
  font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45;
}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* ---------- Encabezado ---------- */
header{background:var(--superficie);border-bottom:4px solid var(--verde)}
.cabecera{max-width:880px;margin:0 auto;padding:18px 20px 0}
.logo{display:block;width:220px;max-width:60vw;height:auto}
h1{
  font-family:"Raleway","Lato",sans-serif;font-weight:800;
  font-size:1.6rem;line-height:1.1;margin:18px 0 0;color:var(--gris);letter-spacing:.01em;
}
h1 span{color:var(--verde)}
.hoy{
  display:inline-flex;align-items:center;gap:10px;margin:12px 0 0;
  background:var(--verde-suave);color:var(--texto);border-radius:999px;padding:6px 14px 6px 6px;
  font-weight:700;
}
.hoy .etiqueta{
  background:var(--verde);color:#fff;border-radius:999px;padding:3px 10px;
  font-family:"Raleway","Lato",sans-serif;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase
}
.fecha-bloque{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0}
.fecha-bloque .hoy{margin:0;cursor:pointer}
.hoy input{border:0;background:transparent;font:inherit;font-weight:700;color:var(--texto);padding:2px 0;cursor:pointer}
.hoy.otra{background:var(--gris-suave)}
.hoy.otra .etiqueta{background:var(--gris)}
.btn-hoy{background:none;border:0;color:var(--verde);font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}

/* ---------- Pestañas ---------- */
.pestanas{display:flex;gap:4px;margin-top:18px;overflow-x:auto}
.pestanas button{
  background:var(--gris-suave);border:0;color:var(--gris);
  font-family:"Raleway","Lato",sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;
  padding:11px 16px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:8px
}
.pestanas button[aria-selected="true"]{background:var(--verde);color:#fff}
.punto{width:9px;height:9px;border-radius:50%;background:var(--gris);opacity:.6;display:inline-block}
.punto.ok{background:var(--verde);opacity:1}
.pestanas button[aria-selected="true"] .punto{background:#fff;opacity:.6}
.pestanas button[aria-selected="true"] .punto.ok{opacity:1}

/* ---------- Contenido ---------- */
main{max-width:880px;margin:0 auto;padding:20px}
.aviso{
  border-left:4px solid var(--rojo);background:var(--superficie);
  padding:12px 14px;margin-bottom:18px;border-radius:0 6px 6px 0
}
.aviso.info{border-left-color:var(--azul)}
.resumen{color:var(--gris);margin:0 0 14px;font-size:.95rem}

.maquinas{list-style:none;margin:0;padding:0;background:var(--superficie);border-radius:10px;border:1px solid var(--linea);overflow:hidden}
.maquina{
  display:grid;grid-template-columns:1fr minmax(170px,220px) auto;gap:12px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--linea)
}
.maquina:last-child{border-bottom:0}
.maquina .nombre{font-family:"Raleway","Lato",sans-serif;font-weight:700;font-size:1.05rem}
.maquina select{
  width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:6px;
  background:var(--superficie);font-size:1rem
}
.maquina.con-dato select{border-color:var(--verde);box-shadow:inset 4px 0 0 var(--verde)}
.maquina.parada{background:var(--gris-suave)}
.maquina.parada select{color:var(--gris)}
.btn-parar{
  border:1px solid var(--linea);background:var(--superficie);border-radius:6px;
  padding:9px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap;color:var(--gris)
}
.maquina.parada .btn-parar{border-color:var(--gris);background:var(--gris);color:#fff;font-weight:700}
@media (max-width:560px){
  .maquina{grid-template-columns:1fr auto}
  .maquina select{grid-column:1 / -1;grid-row:2}
  h1{font-size:1.35rem}
}

.acciones{
  position:sticky;bottom:0;background:var(--fondo);
  padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px
}
.btn-guardar{
  background:var(--verde);color:#fff;border:0;border-radius:8px;
  padding:13px 28px;font-family:"Raleway","Lato",sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:.02em;cursor:pointer
}
.btn-guardar:disabled{opacity:.5;cursor:wait}
.btn-sec{background:var(--superficie);border:1px solid var(--gris);color:var(--gris);border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:700}
.estado{font-size:.95rem;font-weight:700}
.estado.ok{color:var(--verde)} .estado.error{color:var(--rojo)}
.oculto{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <h1>Registro diario <span>de máquinas</span></h1>
    <div class="fecha-bloque">
      <label class="hoy" for="fecha">
        <span class="etiqueta" id="etiquetaFecha">Hoy</span>
        <input type="date" id="fecha" aria-label="Fecha del registro">
      </label>
      <button type="button" class="btn-hoy oculto" id="btnHoy">Volver a hoy</button>
    </div>
    <div class="pestanas" role="tablist" id="pestanas"></div>
  </div>
</header>

<main>
  <div id="avisos"></div>

  <section id="pantallaRegistro" class="oculto">
    <p class="resumen" id="resumen"></p>
    <ul class="maquinas" id="listaMaquinas"></ul>
    <div class="acciones">
      <button class="btn-guardar" id="btnGuardar">Guardar registro</button>
      <button class="btn-sec" id="btnTodasParadas">Marcar todas sin producción</button>
      <span class="estado" id="estado" role="status" aria-live="polite"></span>
    </div>
  </section>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN  —  ESTO ES LO ÚNICO QUE DEBES EDITAR
   Pega aquí la "URL de la aplicación web" de Apps Script (termina en /exec).
   Las pestañas, máquinas y largos se editan en Codigo.gs, no aquí.
   ========================================================= */
const URL_API = "https://script.google.com/macros/s/AKfycbwIznCxiVJh47D1WyLlV3PM3oUe0IfwABAqDS6FZjIYtvaLDjoBHMtz9419aYhkNJoO/exec";
/* ========================================================= */

let DATOS = null;     // pestañas, máquinas y largos que entrega la planilla
let SIN = "Sin produccion";
let pestanaActual = 0;
let seleccion = {};   // hoja -> { maquina: valor }
let guardadas = {};   // hoja -> true si la fecha ya está registrada
let fechaActual = "";  // siempre el día de hoy (aaaa-mm-dd)

const $ = id => document.getElementById(id);

/* Conversa con la planilla de Google (Codigo.gs) */
async function api(parametros, cuerpo){
  const opciones = cuerpo
    ? { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) }
    : { method:"GET" };
  const url = cuerpo ? URL_API : URL_API + "?" + new URLSearchParams(parametros);
  let r;
  try{ r = await fetch(url, opciones); }
  catch(e){ throw new Error("Sin conexión con la planilla. Revisa tu internet e inténtalo de nuevo"); }
  let j;
  try{ j = await r.json(); }
  catch(e){ throw new Error("La planilla respondió algo inesperado (revisa que la URL termine en /exec y que el acceso sea «Cualquier usuario»)"); }
  if (!j.ok) throw new Error(j.error || "Error desconocido");
  return j.datos;
}

/* ---------- Utilidades ---------- */
function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fechaLarga(iso, conAnio){
  const [y,m,d] = iso.split("-").map(Number);
  const opciones = {weekday:"long",day:"numeric",month:"long"};
  if (conAnio) opciones.year = "numeric";
  return new Date(y,m-1,d).toLocaleDateString("es-CL", opciones);
}
const mostrarLargo = v => `${String(v).replace(".", ",")} m`;
const normalizar = v => (v === null || v === undefined || v === "") ? "" :
  (String(v).trim().toLowerCase() === SIN.toLowerCase() ? SIN : String(Number(v)));

function aviso(texto, tipo){
  $("avisos").innerHTML = texto ? `<div class="aviso ${tipo||""}">${texto}</div>` : "";
}
function estado(texto, tipo){
  const e = $("estado"); e.textContent = texto || ""; e.className = "estado " + (tipo||"");
}

/* ---------- Pantalla ---------- */
function dibujarPestanas(){
  $("pestanas").innerHTML = DATOS.pestanas.map((p,i) =>
    `<button role="tab" aria-selected="${i===pestanaActual}" data-i="${i}">
       <span class="punto ${guardadas[p.hoja] ? "ok" : ""}" aria-hidden="true"></span>${p.hoja}
     </button>`).join("");
  $("pestanas").querySelectorAll("button").forEach(b =>
    b.onclick = () => { pestanaActual = Number(b.dataset.i); dibujarPestanas(); cargarPestana(); });
}

function dibujarMaquinas(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const opciones = `<option value="">Elegir largo…</option>` +
    DATOS.largos.map(l => `<option value="${String(Number(l))}">${mostrarLargo(l)}</option>`).join("") +
    `<option value="${SIN}">Sin producción</option>`;

  $("listaMaquinas").innerHTML = p.maquinas.map((m, i) => {
    const v = sel[m] || "";
    return `<li class="maquina ${v===SIN ? "parada" : (v ? "con-dato" : "")}" data-m="${m}">
      <div class="nombre"><label for="sel${i}">${m}</label></div>
      <select id="sel${i}">${opciones}</select>
      <button class="btn-parar" type="button" aria-pressed="${v===SIN}">No está en uso</button>
    </li>`;
  }).join("");

  $("listaMaquinas").querySelectorAll(".maquina").forEach(li => {
    const m = li.dataset.m, s = li.querySelector("select"), b = li.querySelector(".btn-parar");
    s.value = sel[m] || "";
    s.onchange = () => fijar(m, s.value);
    b.onclick = () => fijar(m, (seleccion[p.hoja][m] === SIN) ? "" : SIN);
  });
  actualizarResumen();
}

function fijar(maquina, valor){
  const hoja = DATOS.pestanas[pestanaActual].hoja;
  seleccion[hoja] = seleccion[hoja] || {};
  seleccion[hoja][maquina] = valor;
  const li = [...$("listaMaquinas").children].find(x => x.dataset.m === maquina);
  if (li){
    li.classList.toggle("parada", valor === SIN);
    li.classList.toggle("con-dato", !!valor && valor !== SIN);
    li.querySelector("select").value = valor;
    li.querySelector(".btn-parar").setAttribute("aria-pressed", valor === SIN);
  }
  estado("");
  actualizarResumen();
}

function actualizarResumen(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const llenas = p.maquinas.filter(m => sel[m]).length;
  const paradas = p.maquinas.filter(m => sel[m] === SIN).length;
  let t = `${fechaLarga(fechaActual)}. ${llenas} de ${p.maquinas.length} máquinas con dato`;
  if (paradas) t += `, ${paradas} sin producción`;
  t += guardadas[p.hoja] ? ". Este día ya está registrado; si cambias algo y guardas, se actualiza." : ".";
  $("resumen").textContent = t;
}

async function cargarPestana(){
  const p = DATOS.pestanas[pestanaActual];
  $("listaMaquinas").innerHTML = "";
  $("resumen").textContent = "Cargando máquinas…";
  aviso("");
  try{
    const existentes = await api({ accion:"leer", hoja:p.hoja, fecha:fechaActual });
    seleccion[p.hoja] = {};
    p.maquinas.forEach(m => { seleccion[p.hoja][m] = m in existentes ? normalizar(existentes[m]) : ""; });
    guardadas[p.hoja] = Object.keys(existentes).length > 0;
    dibujarPestanas();
    dibujarMaquinas();
  }catch(e){
    $("resumen").textContent = "";
    aviso(`No se pudo leer la hoja <b>${p.hoja}</b>: ${e.message}.`);
  }
}

/* ---------- Guardar ---------- */
async function guardar(){
  const p = DATOS.pestanas[pestanaActual];
  const sel = seleccion[p.hoja] || {};
  const faltan = p.maquinas.filter(m => !sel[m]);
  if (faltan.length === p.maquinas.length){ estado("Elige un largo o «No está en uso» para al menos una máquina.", "error"); return; }
  if (faltan.length && !confirm(`Faltan ${faltan.length} máquina(s) sin dato:\n${faltan.join(", ")}\n\n¿Guardar igual las demás?`)) return;

  if (fechaActual !== hoyISO() && !confirm(`Vas a guardar el registro del ${fechaLarga(fechaActual, true)}, que no es hoy. ¿Continuar?`)) return;

  const btn = $("btnGuardar"); btn.disabled = true; estado("Guardando…");
  const registros = {};
  p.maquinas.forEach(m => { if (sel[m]) registros[m] = sel[m]; });

  try{
    const r = await api(null, { accion:"guardar", hoja:p.hoja, fecha:fechaActual, registros });
    guardadas[p.hoja] = true;
    dibujarPestanas(); actualizarResumen();
    estado(`Guardado: ${r.agregadas + r.actualizadas} máquina(s) de ${p.hoja}.`, "ok");
  }catch(e){
    estado("No se pudo guardar: " + e.message, "error");
  }finally{
    btn.disabled = false;
  }
}

/* ---------- Fecha: siempre el día de hoy ---------- */
let ultimoHoy = "";    // último "hoy" conocido, para detectar el cambio de día

function fijarFecha(iso){
  fechaActual = iso;
  $("fecha").value = iso;
  const esHoy = iso === hoyISO();
  $("etiquetaFecha").textContent = esHoy ? "Hoy" : "Otra fecha";
  $("fecha").closest(".hoy").classList.toggle("otra", !esHoy);
  $("btnHoy").classList.toggle("oculto", esHoy);
}
function fijarHoy(){ fijarFecha(hoyISO()); }
function recargarDia(){
  guardadas = {};
  estado("");
  if (DATOS) cargarPestana();
}
/* Si la página queda abierta y cambia el día: si estaba en "hoy", pasa sola al nuevo día;
   si el supervisor eligió otra fecha, se respeta su elección. */
function revisarCambioDeDia(){
  const hoy = hoyISO();
  if (hoy === ultimoHoy) return;
  const estabaEnHoy = fechaActual === ultimoHoy;
  ultimoHoy = hoy;
  $("fecha").max = hoy;
  if (estabaEnHoy){ fijarHoy(); recargarDia(); }
  else fijarFecha(fechaActual);
}

/* ---------- Arranque ---------- */
async function iniciar(){
  // La fecha parte siempre en el día de hoy; se puede cambiar para corregir días anteriores
  ultimoHoy = hoyISO();
  $("fecha").max = ultimoHoy;
  fijarHoy();
  $("fecha").onchange = () => {
    const v = $("fecha").value;
    if (!v || v > hoyISO()){ fijarFecha(fechaActual); return; }   // sin fechas futuras
    fijarFecha(v);
    recargarDia();
  };
  $("btnHoy").onclick = () => { fijarHoy(); recargarDia(); };
  setInterval(revisarCambioDeDia, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) revisarCambioDeDia(); });
  $("btnGuardar").onclick = guardar;
  $("btnTodasParadas").onclick = () => {
    if (confirm("¿Marcar todas las máquinas de esta pestaña como sin producción?"))
      DATOS.pestanas[pestanaActual].maquinas.forEach(m => fijar(m, SIN));
  };

  if (!URL_API){
    aviso("Esta página todavía no está conectada a la planilla de Google. Falta pegar la URL de Apps Script en <code>URL_API</code>.", "info");
    return;
  }
  $("resumen").textContent = "Conectando con la planilla…";
  $("pantallaRegistro").classList.remove("oculto");
  try{
    DATOS = await api({ accion:"config" });
    SIN = DATOS.sinProduccion;
    dibujarPestanas();
    cargarPestana();
  }catch(e){
    $("pantallaRegistro").classList.add("oculto");
    aviso(`No se pudo conectar con la planilla: ${e.message}.`);
  }
}
iniciar();
</script>
</body>
</html>
